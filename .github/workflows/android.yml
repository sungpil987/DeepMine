name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - run: node tests/balance.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile browser integration test
        run: node tests/ui.test.cjs
        env:
          SCREENSHOT_PATH: /tmp/deepmine-v3-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeepMine-UI-preview
          path: /tmp/deepmine-v3-mobile.png
          if-no-files-found: ignore
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deepmine-dev-signing-v1
      - name: Build update and side-by-side APKs
        run: |
          mkdir -p dist
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk dist/DeepMine-3.0-update.apk
          gradle assembleDebug -PsideBySide=true --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk dist/DeepMine-3.0-separate.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeepMine-APK
          path: dist/*.apk
          if-no-files-found: error
