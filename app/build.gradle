plugins { id 'com.android.application' }
def sideBySide = providers.gradleProperty('sideBySide').orNull == 'true'
android {
    namespace 'com.peter.deepmine'
    compileSdk 35
    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig { applicationId (sideBySide ? 'com.peter.deepmine.v3' : 'com.peter.deepmine'); manifestPlaceholders = [appLabel: sideBySide ? '딥마인 3.0' : '딥마인']; minSdk 26; targetSdk 35; versionCode 3; versionName '3.0.0' }
}
