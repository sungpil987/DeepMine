<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>딥마인</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><small>THE LITTLE MINING COMPANY</small><h1>DEEP<span>MINE</span><b>01</b></h1></div><button id="sound" aria-label="효과음 켜기">음향 OFF</button></header>
<section class="wallet"><div><small>보유 골드</small><strong id="coins">0 <em>G</em></strong></div><div><small>누적 채굴</small><strong id="mined">0 <em>개</em></strong></div></section>
<div class="location"><span><i></i> 제1광구 · 고요한 동굴</span><span id="combo">탐사 중</span></div>
<section class="mine" id="mine"><canvas id="scene" aria-label="광석을 터치해서 채굴" role="button" tabindex="0"></canvas><div class="ore-label"><span id="rarity">COMMON</span><h2 id="ore">석탄</h2><p id="vein">어떤 보물이 숨어 있을까?</p></div><div class="health"><div><span>광석 내구도</span><b id="hp"></b></div><div class="track"><i id="bar"></i></div></div><span class="tap-hint">광석을 터치해서 채굴하세요</span><button id="bomb">폭탄 <b>3</b></button><div id="burst"></div></section>
<section class="cargo"><div><small>광물 가방 <span id="bagcount">0개</span></small><strong id="bagvalue">0 G</strong></div><button id="sell">모두 판매 <span>→</span></button></section>
<button class="quest" id="quest"><span><small>광부의 첫걸음 · 의뢰</small><b id="questtext">광석 25개 채굴하기</b></span><span id="questprogress">0 / 25</span></button>
<nav><button class="active" data-tab="upgrade">장비 강화</button><button data-tab="book">광물 도감</button><button data-tab="info">탐사 기록</button></nav><section id="panel"></section><footer>한 번만 더 캐면, 전설일지도.</footer></main><div id="toast" role="status"></div><script src="engine.js"></script><script src="game.js"></script></body></html>
