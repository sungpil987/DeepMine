<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b141e"><title>딥마인 · 더 깊은 세계</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><small>THE LITTLE MINING COMPANY</small><h1>DEEP<span>MINE</span><b>3.0</b></h1></div><button id="daily" class="outline">출석 보상</button></header>
<section class="wallet"><div><small>보유 골드</small><strong id="coins">0 <em>G</em></strong></div><div><small>연구 결정</small><strong id="shards">0 <em>◆</em></strong></div><div><small>누적 채굴</small><strong id="mined">0</strong></div></section>
<div class="location"><button id="location">제1광구 · 고요한 동굴 ↗</button><span id="combo">탐사 중</span></div>
<section class="mine" id="mine"><canvas id="scene" aria-label="광석을 터치해서 채굴" role="button" tabindex="0"></canvas><div class="ore-label"><span id="rarity">COMMON</span><h2 id="ore">석탄</h2><p id="vein">작은 행운이 잠든 곳</p></div><div id="bossmark">BOSS VEIN</div><div class="health"><div><span id="hp-label">광석 내구도</span><b id="hp"></b></div><div class="track"><i id="bar"></i></div></div><span class="tap-hint">터치해서 채굴 · 꾹 누르면 연속 채굴</span><button id="bomb">폭탄 <b>3</b></button><div id="burst"></div></section>
<div class="skillrow"><button id="skill"><b>오버드라이브</b><small>10초간 피해 3배</small><span id="skillstatus">READY</span></button><div><small>다음 보스 광맥</small><b id="bossprogress">0 / 50</b><span id="auto">자동 0회/초</span></div></div>
<section class="cargo"><div><small>광물 가방 <span id="bagcount">0개</span></small><strong id="bagvalue">0 G</strong></div><button id="sell">모두 판매 <span>→</span></button></section>
<button class="quest" id="quest"><span><small>광부의 길 · 반복 의뢰</small><b id="questtext">광석 25개 채굴하기</b></span><span id="questprogress">0 / 25</span></button>
<nav aria-label="광산 메뉴"><button class="active" data-tab="upgrade">강화</button><button data-tab="map">탐험</button><button data-tab="craft">공방</button><button data-tab="book">도감</button><button data-tab="goals">업적</button><button data-tab="prestige">환생</button><button data-tab="settings">설정</button></nav><section id="panel"></section><footer>더 깊이, 더 반짝이는 내일. · DEEPMINE 3.0</footer></main>
<div id="discovery" class="modal" hidden><div class="discovery-card"><small id="discover-label">NEW DISCOVERY</small><div id="discover-gem"></div><h2 id="discover-name"></h2><p id="discover-desc"></p><button id="discover-close">계속 채굴하기</button></div></div><div id="toast" role="status"></div><script src="engine.js"></script><script src="scene.js"></script><script src="game.js"></script></body></html>
